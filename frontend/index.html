<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Arena</title>
    <link rel="stylesheet" href="style.css">
    <!-- Plotly CDN for dynamic charts -->
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
</head>
<body class="bg-football">

    <!-- Main Sport Nav -->
    <nav class="sport-nav">
        <button onclick="changeSport('football')" class="nav-btn active" id="btn-football">Football</button>
        <button onclick="changeSport('cricket')" class="nav-btn" id="btn-cricket">Cricket</button>
        <button onclick="changeSport('tennis')" class="nav-btn" id="btn-tennis">Tennis</button>
        <button onclick="changeSport('f1')" class="nav-btn" id="btn-f1">Formula 1</button>
    </nav>

    <!-- Sub Role Nav -->
    <nav class="sport-nav role-nav" id="role-nav">
        <!-- Buttons injected here by JS -->
    </nav>

    <!-- Dynamic Sport Background Animation Layer -->
    <div class="animation-layer">
        <div class="anim-element element-1"></div>
        <div class="anim-element element-2"></div>
        <div class="anim-element element-3"></div>
    </div>

    <!-- Screen 1: Player Selection -->
    <main id="selection-screen" class="content-container">
        <h1 id="selection-title">Select 2 to 4 Players</h1>
        <p class="subtitle">Select your stars to enter the head-to-head arena</p>
        <p id="error-message" class="error-text">Please select between 2 and 4 players.</p>
        
        <div id="player-checkbox-grid" class="checkbox-grid"></div>
        
        <button id="compare-btn" onclick="startComparison()">Compare Head-to-Head</button>
    </main>

    <!-- Screen 2: Comparison Dashboard -->
    <main id="comparison-screen" class="content-container hidden">
        <button onclick="resetSelection()" class="back-btn">← Choose Other Players</button>
        <h1 id="matchup-title">The Arena Comparison</h1>
        
        <!-- Player Stat Cards -->
        <div id="player-cards-container" class="comparison-grid"></div>
        
        <!-- Plotly Chart -->
        <div id="stats-chart"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
